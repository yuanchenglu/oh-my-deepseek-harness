name: deepseek-harness
version: 3.0.0-beta.1
description: Open-source Beta 稳定化清单。当前 Runtime 注册 9 个可工作 Tool；Beta 目标为 10 个，唯一机器可读目标源是 tools.py::TARGET_PUBLIC_TOOL_NAMES，memory_store 由 CON-001 + MEM-001 实现。
author: yuanchenglu

# 依赖声明：Context Engine Plugin（软依赖，不强制）
depends_on:
  context_engine: deepseek-context

# 当前 Runtime 暴露给 LLM 的 9 个可工作 Tool。
# 不在此复制 10 Tool 目标清单；目标名称只由 tools.py::TARGET_PUBLIC_TOOL_NAMES 定义。
provides_tools:
  - plan_create
  - plan_update_step
  - plan_cascade
  - plan_status
  - memory_tag
  - memory_query
  - memory_filter
  - checkpoint_create
  - checkpoint_review

hooks:
  # I-02 + I-08 范围检测注入
  - pre_llm_call
  # I-10 策略指引 + I-08 排除清单
  - pre_llm_call
  # I-17 推理强度控制
  - pre_llm_call
  # I-18 时效信息注入
  - pre_llm_call
  # I-01 审计注入（可选）
  - pre_llm_call
  # 约束违反检测 + I-09 提议
  - post_tool_call
  # I-09 Skill 提议保存
  - on_session_end
  # 子任务追踪
  - subagent_start
  # 子任务追踪
  - subagent_stop
