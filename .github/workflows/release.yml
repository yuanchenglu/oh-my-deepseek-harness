name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "rc-*"

# Least privilege: read-only contents; no tokens, no publishing.
permissions:
  contents: read

jobs:
  release-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run release tests
        run: bash scripts/test_release.sh python
      - name: Build reproducible RC + provenance (non-publishing)
        run: bash scripts/release/build_rc.sh python
      - name: Upload RC evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence
          path: dist/rel-*/
          if-no-files-found: error