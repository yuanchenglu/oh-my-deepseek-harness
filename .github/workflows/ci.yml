name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      QA_ARTIFACT_RESULTS_DIR: test-results/artifact-${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install project and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp]"
    - name: Run complete test suite and external artifact lifecycle
      run: |
        mkdir -p test-results
        pytest -ra --junitxml=test-results/pytest-${{ matrix.python-version }}.xml
    - name: Upload test and artifact evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-${{ matrix.python-version }}
        path: test-results/
        if-no-files-found: error
