[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-deepseek-harness"
version = "3.0.0b1"
description = "DeepSeek 深度优化插件 -- 14 项物理特性全激发"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "yuanchenglu"}]

dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.25.0",
]
mcp = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
]

[project.entry-points."hermes_agent.plugins"]
deepseek-harness = "deepseek_harness"
deepseek-context = "deepseek_context.plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepseek_harness*", "deepseek_context*", "harness_server*"]

[tool.setuptools.package-data]
deepseek_harness = ["resources/*.yaml"]
deepseek_context = ["resources/*.yaml"]
harness_server = ["config.yaml"]
