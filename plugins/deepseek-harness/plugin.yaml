name: deepseek-harness
version: 3.0.0-beta.1
description: Open-source Beta 稳定化清单。当前运行时注册 9 个工具；Beta 目标第 10 个 memory_store 由后续 Contract/Memory Work ID 实现。
author: yuanchenglu

# 依赖声明：Context Engine Plugin（软依赖，不强制）
depends_on:
  context_engine: deepseek-context

# 当前运行时暴露给 LLM 的 9 个工具（Beta 目标为 10 个）
provides_tools:
  - plan_create
  - plan_update_step
  - plan_cascade
  - plan_status
  - memory_tag
  - memory_query
  - memory_filter
  - checkpoint_create
  - checkpoint_review

hooks:
  # I-02 + I-08 范围检测注入
  - pre_llm_call
  # I-10 策略指引 + I-08 排除清单
  - pre_llm_call
  # I-17 推理强度控制
  - pre_llm_call
  # I-18 时效信息注入
  - pre_llm_call
  # I-01 审计注入（可选）
  - pre_llm_call
  # 约束违反检测 + I-09 提议
  - post_tool_call
  # I-09 Skill 提议保存
  - on_session_end
  # 子任务追踪
  - subagent_start
  # 子任务追踪
  - subagent_stop
